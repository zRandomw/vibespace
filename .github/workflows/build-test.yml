name: Build Test

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'build-test/**'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'build-test/**'
      - '.github/workflows/build-test.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: diy-vibe-space

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required fixture files
        run: |
          test -f build-test/Dockerfile
          test -f build-test/docker-compose.yml
          test -f build-test/entrypoint.sh

      - name: Check JavaScript syntax
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify Codex config fixture
        run: |
          if [ -f build-test/config.toml ]; then
            grep -Eq '^[[:space:]]*COPY[[:space:]]+(\./)?config\.toml[[:space:]]+/root/\.codex/config\.toml' build-test/Dockerfile
          else
            echo "build-test/config.toml not present; skipping Codex config fixture check."
          fi

      - name: Get lowercase owner
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify docker-compose config
        run: docker compose -f build-test/docker-compose.yml config --quiet

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:latest-alpine hadolint --failure-threshold error - < build-test/Dockerfile

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: build-test
          file: build-test/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:aio
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify entrypoint exists
        run: docker run --rm --entrypoint "" ${{ env.IMAGE_NAME }}:aio test -x /usr/local/bin/entrypoint.sh

      - name: Verify Codex config in image
        run: |
          if [ -f build-test/config.toml ]; then
            docker run --rm --entrypoint "" ${{ env.IMAGE_NAME }}:aio test -f /root/.codex/config.toml
            docker run --rm --entrypoint "" -v "$PWD/build-test/config.toml:/tmp/expected-config.toml:ro" ${{ env.IMAGE_NAME }}:aio cmp /tmp/expected-config.toml /root/.codex/config.toml
          else
            echo "build-test/config.toml not present; skipping image Codex config check."
          fi

      - name: Verify installed tools
        run: |
          docker run --rm --entrypoint "" ${{ env.IMAGE_NAME }}:aio bash -c '
            echo "=== Go ===" && go version &&
            echo "=== Node ===" && node --version &&
            echo "=== npm ===" && npm --version &&
            echo "=== Python ===" && python3 --version &&
            echo "=== TypeScript ===" && tsc --version &&
            echo "=== Rust ===" && rustc --version &&
            echo "=== Java ===" && java --version &&
            echo "=== code-server ===" && code-server --version &&
            echo "=== Claude Code ===" && claude --version &&
            echo "=== Codex CLI ===" && codex --version &&
            echo "=== Git ===" && git --version &&
            echo "All tools verified!"
          '

      - name: Verify exposed ports
        run: |
          PORTS=$(docker inspect --format='{{json .Config.ExposedPorts}}' ${{ env.IMAGE_NAME }}:aio)
          echo "Exposed ports: $PORTS"
          echo "$PORTS" | grep -q "12345/tcp" && echo "Port 12345: OK"
          echo "$PORTS" | grep -q "22/tcp" && echo "Port 22: OK"

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          GHCR_TAG=ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:aio
          docker tag ${{ env.IMAGE_NAME }}:aio "$GHCR_TAG"
          docker push "$GHCR_TAG"
          echo "Pushed: $GHCR_TAG"
